<body class="bg-background text-on-background font-body antialiased min-h-screen flex flex-col items-center justify-center p-4">
<!-- Top App Bar (Modified for transactional screen - just back button) -->
<header class="w-full max-w-md flex justify-between items-center h-16 absolute top-0 left-1/2 -translate-x-1/2 px-5">
<button class="flex items-center justify-center text-on-surface hover:bg-surface-container rounded-full p-2 transition-colors">
<span class="material-symbols-outlined text-[24px]">arrow_back</span>
</button>
<span class="font-headline font-bold text-lg text-primary tracking-tight">DBU Connect</span>
<div class="w-10"></div> <!-- Spacer for centering -->
</header>
<main class="w-full max-w-md mt-16 pb-8">
<!-- Header Section -->
<div class="mb-8 px-2 text-center sm:text-left">
<h1 class="font-headline text-3xl font-bold text-on-surface mb-2">Create Account</h1>
<p class="text-on-surface-variant text-base leading-[1.6]">Join the DBU Connect community today.</p>
</div>
<!-- Sign Up Form Card -->
<div class="bg-surface-container-lowest rounded-xl p-6 shadow-[0_4px_20px_rgba(46,50,48,0.06)] border border-outline-variant/30">
<form class="space-y-5">
<!-- Full Name Field -->
<div>
<label class="block font-label text-sm font-semibold text-on-surface mb-1.5 ml-1" for="fullName">Full Name</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline text-[20px]">person</span>
</div>
<input class="w-full bg-surface text-on-surface border border-outline-variant rounded-lg py-3 pl-10 pr-4 focus:ring-2 focus:ring-primary focus:border-primary transition-shadow placeholder:text-on-surface-variant/60 font-body text-base" id="fullName" placeholder="John Doe" type="text"/>
</div>
</div>
<!-- DBU Student Email Field -->
<div>
<label class="block font-label text-sm font-semibold text-on-surface mb-1.5 ml-1" for="email">DBU Student Email</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline text-[20px]">mail</span>
</div>
<input class="w-full bg-surface text-on-surface border border-outline-variant rounded-lg py-3 pl-10 pr-4 focus:ring-2 focus:ring-primary focus:border-primary transition-shadow placeholder:text-on-surface-variant/60 font-body text-base" id="email" placeholder="name@dbu.edu.et" type="email"/>
</div>
</div>
<!-- Phone Number Field -->
<div>
<label class="block font-label text-sm font-semibold text-on-surface mb-1.5 ml-1" for="phone">Phone Number</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline text-[20px]">phone</span>
</div>
<input class="w-full bg-surface text-on-surface border border-outline-variant rounded-lg py-3 pl-10 pr-4 focus:ring-2 focus:ring-primary focus:border-primary transition-shadow placeholder:text-on-surface-variant/60 font-body text-base" id="phone" placeholder="+251 911 234 567" type="tel"/>
</div>
</div>
<!-- Password Field -->
<div>
<label class="block font-label text-sm font-semibold text-on-surface mb-1.5 ml-1" for="password">Password</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline text-[20px]">lock</span>
</div>
<input class="w-full bg-surface text-on-surface border border-outline-variant rounded-lg py-3 pl-10 pr-10 focus:ring-2 focus:ring-primary focus:border-primary transition-shadow placeholder:text-on-surface-variant/60 font-body text-base" id="password" placeholder="••••••••" type="password"/>
<button class="absolute inset-y-0 right-0 pr-3.5 flex items-center text-outline hover:text-on-surface transition-colors" type="button">
<span class="material-symbols-outlined text-[20px]">visibility</span>
</button>
</div>
</div>
<!-- Submit Button -->
<button class="w-full bg-primary text-on-primary font-label font-bold text-base rounded-lg py-3.5 px-4 mt-4 hover:bg-surface-tint active:scale-[0.98] transition-all flex justify-center items-center gap-2 shadow-[0_4px_14px_rgba(74,124,89,0.25)]" type="submit">
                    Create Account
                    <span class="material-symbols-outlined text-[20px]">arrow_forward</span>
</button>
</form>
<div class="mt-6 flex items-center justify-between">
<hr class="w-full border-outline-variant/50"/>
<span class="p-2 text-on-surface-variant font-label text-sm bg-surface-container-lowest absolute left-1/2 -translate-x-1/2">OR</span>
</div>
<!-- Social Sign Up -->
<button class="w-full bg-surface-container text-on-surface font-label font-semibold text-base rounded-lg py-3 px-4 mt-6 border border-outline-variant/40 hover:bg-surface-container-high active:scale-[0.98] transition-all flex justify-center items-center gap-3" type="button">
<svg aria-hidden="true" class="w-5 h-5" viewbox="0 0 24 24">
<path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"></path>
<path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path>
<path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"></path>
<path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"></path>
</svg>
                Sign up with Google
            </button>
</div>
<!-- Legal Caption -->
<p class="text-center text-on-surface-variant text-sm font-label mt-6 px-4 leading-relaxed">
            By signing up, you agree to our 
            <a class="text-primary hover:underline font-semibold" href="#">Terms of Service</a> and 
            <a class="text-primary hover:underline font-semibold" href="#">Privacy Policy</a>.
        </p>
<p class="text-center text-on-surface-variant text-sm font-label mt-4">
            Already have an account? <a class="text-primary hover:underline font-semibold" href="#">Log In</a>
</p>
</main>
</body></html>
